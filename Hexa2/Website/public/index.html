<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexa - 인증</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="hero-panel">
        <p class="eyebrow">HEXA PLATFORM</p>
        <h1>회원 계정을 만들고 사용자 데이터를 안전하게 저장하세요.</h1>
        <p>
          회원가입 및 로그인 정보는 데이터베이스에 저장되며, 로그인 후 개인정보와 선호 정보도 저장할 수 있습니다.
        </p>
      </section>

      <section class="card-panel">
        <div class="tab-row">
          <button id="signupTab" class="tab is-active" type="button">회원가입</button>
          <button id="loginTab" class="tab" type="button">로그인</button>
        </div>

        <form id="signupForm" class="form is-active">
          <label>
            아이디
            <input type="text" name="username" required minlength="4" placeholder="4자 이상 입력" />
          </label>
          <label>
            비밀번호
            <input type="password" name="password" required minlength="6" placeholder="6자 이상 입력" />
          </label>
          <button class="btn-primary" type="submit">계정 만들기</button>
        </form>

        <form id="loginForm" class="form">
          <label>
            아이디
            <input type="text" name="username" required placeholder="아이디 입력" />
          </label>
          <label>
            비밀번호
            <input type="password" name="password" required placeholder="비밀번호 입력" />
          </label>
          <button class="btn-primary" type="submit">로그인</button>
        </form>

        <p id="authMessage" class="message"></p>
      </section>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
