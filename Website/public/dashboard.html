<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexa - 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="dashboard-layout">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">로그인 상태</p>
          <h1 id="welcomeTitle">환영합니다</h1>
        </div>
        <button id="logoutBtn" class="btn-ghost" type="button">로그아웃</button>
      </header>

      <section class="grid-two">
        <article class="card-panel">
          <h2>개인정보</h2>
          <form id="profileForm" class="form is-active">
            <label>
              이름
              <input type="text" name="fullName" placeholder="이름 입력" />
            </label>
            <label>
              연락처
              <input type="text" name="phone" placeholder="010-0000-0000" />
            </label>
            <label>
              자기소개
              <textarea name="bio" rows="3" placeholder="간단한 소개를 입력하세요"></textarea>
            </label>
            <button class="btn-primary" type="submit">개인정보 저장</button>
          </form>
        </article>

        <article class="card-panel">
          <h2>선호 정보</h2>
          <form id="preferencesForm" class="form is-active">
            <label>
              관심사
              <input type="text" name="interests" placeholder="음악, 여행, 코딩" />
            </label>
            <label class="checkbox-row">
              <input type="checkbox" name="notifications" />
              알림 받기
            </label>
            <label>
              테마
              <select name="theme">
                <option value="light">라이트</option>
                <option value="dark">다크</option>
                <option value="system">시스템</option>
              </select>
            </label>
            <button class="btn-primary" type="submit">선호 정보 저장</button>
          </form>
        </article>
      </section>

      <p id="dashboardMessage" class="message"></p>
    </main>

    <script src="/js/dashboard.js"></script>
  </body>
</html>
